server:
  port: 8888 # Port du Gateway

spring:
  application:
    name: Gateway # Nom du service
  cloud:
    discovery:
      enabled: true # Active la decouverte de services
    gateway:
      discovery:
        locator:
          enabled: true # Routes automatiques lb://NOM-SERVICE a partir d'Eureka
          lower-case-service-id: false # garde SERVICE-CLIENT en majuscules dans l'URL

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${server.port}"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "http://localhost:8761/eureka/"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,gateway"
  endpoint:
    health:
      show-details: "always"
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
