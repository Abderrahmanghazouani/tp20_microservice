server:
  port: 8082 # Port pour le service voiture

spring:
  application:
    name: SERVICE-CAR # Nom du service dans Eureka
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/carservicedb?createDatabaseIfNotExist=true
    username: "root"
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# URL du service client, appelee AVEC RestTemplate en passant par la Gateway
client-service:
  url: http://localhost:8888/SERVICE-CLIENT/api/client/
